[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-os"
version = "0.1.0"
description = "Career as Code: validate structured career data and generate professional artifacts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "pydantic>=2.9,<3",
  "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
career = "career_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
career_os = ["templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
